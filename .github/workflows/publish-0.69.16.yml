ry bez oczekiwania.\n- Sklep: gry twórcy, DLC oraz gry pozostałych autorów. Dodawanie do biblioteki, osobna instalacja i aktualizacja gier.\n- Nowa instalacja launchera bez pobranych gier. Dotychczasowe instalacje i zapisy zachowane.\n- Krótsza pomoc R-Engine: kontakt z twórcą oraz informacja C++20 / OpenGL.\n\nPrywatna przebudowa wyglądu launchera i gier nie jest częścią wydania.\n";
          (async()=>{for(const file of spec.files){fs.writeFileSync(file.name,'');for(const index of file.parts){const p=spec.parts[index];let data;for(let attempt=0;attempt<5;attempt++){try{const r=await fetch('https://gmxrbxudhkaxbhipuovs.supabase.co/functions/v1/launcher-engine-transfer?part='+index,{headers,signal:AbortSignal.timeout(60000)});if(!r.ok)throw Error('Part '+index+' HTTP '+r.status);data=Buffer.from(await r.arrayBuffer());assert.equal(data.length,p.bytes);assert.equal(crypto.createHash('sha256').update(data).digest('hex'),p.sha256);break;}catch(e){if(attempt===4)throw e;await new Promise(r=>setTimeout(r,2000));}}fs.appendFileSync(file.name,data);}const b=fs.readFileSync(file.name);assert.equal(b.length,file.bytes);assert.equal(crypto.createHash('sha256').update(b).digest('hex'),file.sha256);console.log('Verified '+file.name);}function signed(text){const e=JSON.parse(text),payload=Buffer.from(e.payload,'base64');assert(crypto.verify(null,payload,key,Buffer.from(e.signature,'base64')));return JSON.parse(payload);}const m=signed(envelope);assert.equal(m.version,'0.69.16');const installer=fs.readFileSync(m.file);assert.equal(m.size,installer.length);assert.equal(crypto.createHash('sha512').update(installer).digest('hex'),m.sha512);const catalog=signed(fs.readFileSync('component-catalog.json','utf8'));assert.equal(catalog.schema,1);for(const item of catalog.components){const name=new URL(item.url).pathname.split('/').pop(),b=fs.readFileSync(name);assert.equal(b.length,item.bytes);assert.equal(crypto.createHash('sha256').update(b).digest('hex'),item.sha256);assert.equal(crypto.createHash('sha512').update(b).digest('hex'),item.sha512);}fs.writeFileSync('update.json',envelope);fs.writeFileSync('RELEASE-NOTES.md',notes);console.log('All packages and Ed25519 signatures verified');})().catch(e=>{console.error(e.message);process.exitCode=1;});
